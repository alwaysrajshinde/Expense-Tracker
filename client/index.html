<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PocketNook</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="application-name" content="PocketNook" />
    <meta name="apple-mobile-web-app-title" content="PocketNook" />
    <meta name="description" content="PocketNook - Personal finance and mindful daily expense tracking with real-time cloud sync, visual analytics, and offline-first storage." />
    <meta name="theme-color" content="#6C47FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Firebase Runtime Configuration -->
    <script src="./firebase-config.js"></script>

    <!-- Google Identity Services (GIS) for Google OAuth 2.0 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
