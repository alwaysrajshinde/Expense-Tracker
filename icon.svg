<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#371485" />
      <stop offset="50%" stop-color="#5824dc" />
      <stop offset="100%" stop-color="#763cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#371485" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#purpleGrad)" />
  
  <!-- Wallet Body -->
  <g transform="translate(106, 126)" filter="url(#shadow)">
    <!-- Base Card / Wallet Back -->
    <rect x="0" y="20" width="300" height="220" rx="36" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Top Flap Accent -->
    <path d="M 0 56 C 0 36 16 20 36 20 L 264 20 C 284 20 300 36 300 56 L 300 90 L 0 90 Z" fill="#ede9fe" />
    
    <!-- Wallet Pocket Line -->
    <line x1="20" y1="120" x2="280" y2="120" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
    
    <!-- Clasp Tab -->
    <rect x="180" y="95" width="120" height="70" rx="20" fill="#6c47ff" />
    <circle cx="215" cy="130" r="14" fill="#ffffff" />
    <circle cx="215" cy="130" r="7" fill="#fbbf24" />
    
    <!-- Decorative Trend Graph Line Inside -->
    <path d="M 40 185 Q 90 155 130 175 T 190 145" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />
    <circle cx="190" cy="145" r="5" fill="#8b5cf6" />
  </g>
</svg>
